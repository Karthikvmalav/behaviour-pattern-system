<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Coach - Hyderabad Runners</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;color:#1D1D1F;background:#F5F5F7}
button{font-family:inherit;cursor:pointer;transition:background-color .2s ease,box-shadow .2s ease,transform .1s ease}button:active{transform:scale(0.98)}h1,h2,h3{letter-spacing:-0.022em}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
input::placeholder{color:#86868B}input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.fld{font:inherit;font-size:15px;color:#1D1D1F;background:#F5F5F7;border:1px solid transparent;border-radius:12px;padding:11px 14px;min-height:44px;box-sizing:border-box;outline:none;transition:box-shadow .15s ease,border-color .15s ease,background .15s ease}.fld:focus{background:#FFFFFF;border-color:#0071E3;box-shadow:0 0 0 4px rgba(0,113,227,0.18)}.fld::placeholder{color:#AEAEB2}
a{color:#0058B8}
</style>
<style>
html,body{height:100%}
#app{height:100vh;overflow:auto}
header > div:last-child > span{white-space:nowrap}
html.dark body{background:#000000;color:#F5F5F7}
html.dark .fld{background:#2C2C2E !important;color:#F5F5F7 !important;border-color:transparent}
html.dark .fld:focus{background:#1C1C1E !important;border-color:#0A84FF !important;box-shadow:0 0 0 4px rgba(10,132,255,0.3) !important}
html.dark .fld::placeholder, html.dark input::placeholder{color:#8E8E93}
html.dark input{color:#F5F5F7}
button:focus-visible, a:focus-visible, [tabindex]:focus-visible, input:focus-visible{outline:3px solid #0A84FF !important;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
div[style*="position: absolute; inset: 0"]{position:fixed !important}
div[role="status"][style*="position: absolute"]{position:fixed !important}
#app > div{width:100% !important;height:100vh !important;min-width:1100px;min-height:640px}
@media (max-width: 900px) {
  #app{height:auto;overflow:visible}
  #app > div{min-width:0 !important;height:auto !important;min-height:100vh;flex-direction:column !important;overflow:visible !important}
  nav[aria-label="Main"]{width:100% !important;padding:12px 12px 8px !important;gap:10px !important;border-right:none !important;border-bottom:1px solid #E5E5EA;overflow:visible !important}
  nav[aria-label="Main"] > div:first-child span[style*="width: 40px"]{width:32px !important;height:32px !important}
  main [style*="repeat(2, minmax(0, 1fr)); gap: 12px"]{grid-template-columns:1fr !important}
  nav[aria-label="Main"] > div:last-child{display:none !important}
  nav[aria-label="Main"] > div:nth-child(3){flex-direction:row !important;gap:4px !important;overflow-x:auto;padding-bottom:4px}
  nav[aria-label="Main"] > div:nth-child(3) > div{flex-direction:row !important;flex-shrink:0}
  nav[aria-label="Main"] > div:nth-child(3) > div > div{display:none}
  nav[aria-label="Main"] > div:nth-child(3) button{white-space:nowrap}
  header{height:auto !important;padding:14px 16px !important;flex-wrap:wrap;gap:8px}
  header h1{font-size:24px !important}
  main{overflow:visible !important;padding:16px 14px 90px !important}
  main [style*="grid-template-columns: 1."], main [style*="grid-template-columns: 1fr 360px"], main [style*="grid-template-columns: 430px 1fr"], main [style*="grid-template-columns: 1.3fr 1fr"]{grid-template-columns:1fr !important}
  main [style*="repeat(5, minmax(0, 1fr))"], main [style*="repeat(6, minmax(0, 1fr))"], main [style*="repeat(4, minmax(0, 1fr))"], main [style*="repeat(3, minmax(0, 1fr))"]{grid-template-columns:repeat(2, minmax(0, 1fr)) !important}
  main [style*="repeat(12, minmax(0, 1fr))"]{gap:3px !important}
  main [style*="1fr 28px 1fr 28px 1fr"]{grid-template-columns:1fr !important}
  main [style*="1fr 28px 1fr 28px 1fr"] > svg{display:none}
  main [style*="width: 500px"], main [style*="width: 420px"], main [style*="width: 460px"], main [style*="width: 220px"]{width:100% !important}
  main article[style*="grid-template-columns: 48px 1fr auto"]{grid-template-columns:48px 1fr !important}
  main article[style*="grid-template-columns: 48px 1fr auto"] > div:nth-child(3){grid-column:1 / -1;flex-wrap:wrap}
  main [style*="grid-template-columns: 36px 1fr 120px 150px"]{grid-template-columns:36px 1fr 130px !important}
  main [style*="grid-template-columns: 36px 1fr 120px 150px"] > span:nth-child(3){display:none !important}
  main [style*="justify-content: space-between"]{flex-wrap:wrap}
  main section[aria-label="Next step"]{flex-wrap:wrap}
  main section[aria-label="Next step"] > div:last-child{width:100%}
  main section[aria-label="Next step"] > div:last-child > button{flex:1}
  main section, main form, main article{max-width:100%;box-sizing:border-box;overflow-x:auto}
  main [style*="position: sticky; top: -28px"]{position:static !important}
  main [style*="168px repeat(12"]{grid-template-columns:96px repeat(12, minmax(0, 1fr)) !important}
  main [style*="168px repeat(12"] > span:last-child{display:none}
  main [style*="110px 1.1fr 1.8fr 160px"]{grid-template-columns:90px 1fr !important}
  main [style*="110px 1.1fr 1.8fr 160px"] > span:nth-child(3), main [style*="110px 1.1fr 1.8fr 160px"] > span:nth-child(4){display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 1440px; height: 960px; display: flex; background: #F5F5F7; overflow: hidden; position: relative">


<nav aria-label="Main" style="width: 264px; flex-shrink: 0; background: rgba(246,246,248,0.92); border-right: 1px solid #E5E5EA; display: flex; flex-direction: column; padding: 20px 14px 16px; box-sizing: border-box; gap: 18px; overflow-y: auto">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 6px">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: linear-gradient(160deg, #3D9BFF 0%, #0066D6 100%); box-shadow: 0 2px 6px rgba(0,102,214,0.28), inset 0 1px 0 rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 28 28" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 15h5l3-7 5 13 3-8 2 2h6"></path></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<div style="font-weight: 700; font-size: 15px; color: #1D1D1F; line-height: 1.2">Pattern Coach</div>
<div style="font-size: 12px; color: #86868B">Hyderabad Runners</div>
</div>
</div>

<label style="display: flex; align-items: center; gap: 8px; background: #E8E8ED; border-radius: 10px; padding: 0 10px; min-height: 36px">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#86868B" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M20 20l-4.8-4.8"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search runners</span>
<input id="search" type="search" placeholder="Search runners" value="{{q}}" onInput="{{onSearch}}" autocomplete="off" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 14px; color: #1D1D1F; padding: 8px 0">
<sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}">
<button onClick="{{clearQ}}" aria-label="Clear search" style="border: none; background: #AEAEB2; width: 18px; height: 18px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="9" height="9" viewBox="0 0 10 10" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6"></path></svg></button>
</sc-if>
</label>

<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{navGroups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 1px">
<div style="font-size: 11px; font-weight: 600; color: #86868B; padding: 0 10px 4px">{{g.title}}</div>
<sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
<button onClick="{{n.go}}" style="display: flex; align-items: center; gap: 10px; border: none; border-radius: 8px; padding: 7px 10px; min-height: 36px; font-size: 14px; font-weight: 500; text-align: left; background: {{n.bg}}; color: {{n.fg}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0071E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span style="flex-grow: 1">{{n.label}}</span>
<sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; font-weight: 600; color: {{n.badgeFg}}; background: {{n.badgeBg}}; border-radius: 999px; padding: 1px 8px">{{n.badge}}</span>
</sc-if>
</button>
</sc-for>
</div>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<div style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 12px; padding: 12px; display: flex; gap: 10px; align-items: flex-start">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0071E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; line-height: 1.45; color: #6E6E73">The app spots patterns. You decide what to do. It never contacts runners.</span><button onClick="{{openHelp}}" style="align-self: flex-start; border: none; background: none; padding: 0; color: #0071E3; font-size: 12px; font-weight: 600">How it works</button></div>
</div>
<div style="display: flex; align-items: center; gap: 10px; border-top: 1px solid #E5E5EA; padding: 12px 6px 0">
<span style="width: 32px; height: 32px; border-radius: 999px; background: #34A853; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">CS</span>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 13px; font-weight: 600; color: #1D1D1F">Coach Sameer</span>
<span style="font-size: 12px; color: #86868B">Run leader, {{sessionCount}} sessions</span>
</div>
</div>
<div role="group" aria-label="Appearance" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; background: #E8E8ED; border-radius: 10px; padding: 2px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="3"><button onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="border: none; border-radius: 8px; padding: 5px 4px; min-height: 30px; font-size: 12px; font-weight: 600; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.sh}}">{{t.label}}</button></sc-for>
</div>
</div>
</nav>


<div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<header style="height: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; border-bottom: 1px solid #E8E8ED; background: rgba(255,255,255,0.72); backdrop-filter: saturate(180%) blur(20px); box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 600; color: #86868B; text-transform: uppercase; letter-spacing: 0.02em">{{eyebrow}}</div>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.15">{{title}}</h1>
<div style="font-size: 13px; color: #6E6E73">{{subtitle}}</div>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 12px; font-weight: 600; background: #FFF6DC; color: #6B5300; border: 1px solid #F5E4B0; border-radius: 999px; padding: 5px 10px">Sample data</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #424245; background: #FFFFFF; border: 1px solid #E8E8ED; border-radius: 999px; padding: 6px 14px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1E7A45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
Patterns up to date for W{{week}}
</span>
</div>
</header>

<main style="flex-grow: 1; overflow: auto; padding: 28px 36px 48px; box-sizing: border-box">


<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 20px">

<section aria-label="Next step" style="display: flex; align-items: center; gap: 16px; background: linear-gradient(180deg, #F3F8FF 0%, #FFFFFF 100%); border: 1px solid #DCEAFD; border-radius: 20px; padding: 18px 22px">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #0071E3; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{next.icon}}"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-size: 12px; font-weight: 700; color: #0058B8">Next step</span>
<span style="font-size: 17px; font-weight: 600; color: #1D1D1F">{{next.title}}</span>
<span style="font-size: 13px; color: #6E6E73">{{next.sub}}</span>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button onClick="{{next.go}}" style="border: none; background: #0071E3; color: #FFFFFF; border-radius: 999px; padding: 10px 18px; min-height: 42px; font-size: 14px; font-weight: 600">{{next.cta}}</button>
<button onClick="{{next.go2}}" style="border: 1px solid #E0E0E5; background: #FFFFFF; color: #1D1D1F; border-radius: 999px; padding: 10px 18px; min-height: 42px; font-size: 14px; font-weight: 600">{{next.cta2}}</button>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 19px">Your runners at a glance</h2>
<span style="font-size: 12.5px; color: #86868B">{{glanceSub}}</span>
</div>
<button onClick="{{goPatterns}}" style="border: none; background: none; color: #0071E3; font-size: 13px; font-weight: 600; padding: 8px 0">What these mean</button>
</div>
<div role="img" aria-label="{{glanceAria}}" style="display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: #F2F2F5; gap: 2px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="5"><div title="{{t.label}}: {{t.count}}" style="height: 14px; width: {{t.w}}%; background: {{t.bar}}"></div></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="5">
<button onClick="{{t.go}}" style="text-align: left; border: none; background: #F9F9FB; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; color: #1D1D1F">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: {{t.fg}}"><span style="width: 9px; height: 9px; border-radius: 999px; background: {{t.bar}}"></span>{{t.label}}</span>
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 26px; font-weight: 700; line-height: 1.05">{{t.count}}</span><span style="font-size: 11.5px; font-weight: 600; color: {{t.dFg}}">{{t.delta}}</span></span>
<span style="font-size: 12px; color: #6E6E73; line-height: 1.35">{{t.desc}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #F0F0F3; padding-top: 14px">
<span style="font-size: 13px; font-weight: 600; color: #424245">How they're changing</span>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{shapeCards}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.go}}" aria-label="{{c.label}}: {{c.count}} runners" style="text-align: left; border: none; background: #F9F9FB; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; color: #1D1D1F">
<span style="display: flex; align-items: flex-end; gap: 2px; height: 22px; width: 100%">
<sc-for list="{{c.bars}}" as="b" hint-placeholder-count="12"><span style="flex-grow: 1; border-radius: 2px; height: {{b.hs}}px; background: {{b.c}}"></span></sc-for>
</span>
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 6px"><span style="font-size: 12.5px; font-weight: 600">{{c.label}}</span><span style="font-size: 18px; font-weight: 700">{{c.count}}</span></span>
</button>
</sc-for>
</div>
</div>
</section>

<div style="display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 18px">
<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px 24px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 19px">Who needs you this week</h2>
<span style="font-size: 12.5px; color: #86868B">Most urgent first, based on their pattern</span>
</div>
<button onClick="{{goAttention}}" style="border: none; background: none; color: #0071E3; font-size: 13px; font-weight: 600; padding: 8px 0">See all {{todoCount}}</button>
</div>
<sc-if value="{{noTodo}}" hint-placeholder-val="{{ false }}">
<div style="background: #E4F6EA; border-radius: 14px; padding: 18px; font-size: 14px; color: #1E7A45; font-weight: 600">All caught up. Nobody needs a follow-up right now.</div>
</sc-if>
<sc-for list="{{topTodo}}" as="a" hint-placeholder-count="4">
<button onClick="{{a.open}}" style="display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; text-align: left; border: none; background: #F9F9FB; border-radius: 14px; padding: 12px 14px; color: #1D1D1F">
<span style="width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; background: {{a.bg}}; color: {{a.fg}}">{{a.initials}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 14.5px; font-weight: 600">{{a.name}} <span style="font-weight: 500; color: {{a.shapeFg}}">· {{a.shapeLabel}}</span></span>
<span style="font-size: 13px; color: #6E6E73; line-height: 1.35">{{a.reason}}</span>
</span>
<span style="font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 9px; background: {{a.prBg}}; color: {{a.prFg}}; white-space: nowrap">{{a.priority}}</span>
</button>
</sc-for>
</section>
<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px 24px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 19px">Did your check-ins help?</h2>
<span style="font-size: 12.5px; color: #86868B">{{outcomeSummary}}. A sign, not proof: they might have come back anyway.</span>
</div>
<sc-if value="{{noOutcomes}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #86868B">No check-ins logged yet.</span></sc-if>
<sc-for list="{{outcomes}}" as="o" hint-placeholder-count="4">
<button onClick="{{o.open}}" style="display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; text-align: left; border: none; background: #F9F9FB; border-radius: 12px; padding: 9px 12px; color: #1D1D1F">
<span style="width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}">{{o.initials}}</span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">{{o.name}}</span><span style="font-size: 12.5px; color: #6E6E73">{{o.what}} in {{o.when}}</span></span>
<span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; background: {{o.rBg}}; color: {{o.rFg}}; white-space: nowrap">{{o.result}}</span>
</button>
</sc-for>
</section>
</div>

<div style="display: flex; flex-direction: column; gap: 18px">
<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px 24px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 19px">Wins to celebrate</h2>
<sc-if value="{{noWins}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #86868B">No streaks or comebacks this week.</span></sc-if>
<sc-for list="{{wins}}" as="w" hint-placeholder-count="3">
<button onClick="{{w.open}}" style="display: flex; gap: 12px; align-items: center; text-align: left; border: none; background: #F9F9FB; border-radius: 14px; padding: 10px 12px; color: #1D1D1F">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #E4F6EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E7A45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">{{w.name}}</span><span style="font-size: 12.5px; color: #6E6E73">{{w.text}}</span></span>
</button>
</sc-for>
</section>
</div>
</div>


<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 19px">Your sessions</h2>
<span style="font-size: 12.5px; color: #86868B">If a whole session dips together, look at the session, not the runners</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{sessions}}" as="g" hint-placeholder-count="4">
<div style="background: #F9F9FB; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">{{g.name}}</span><span style="color: #6E6E73">{{g.total}} runners</span></div>
<div style="display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: #E8E8ED; gap: 2px">
<sc-for list="{{g.segs}}" as="sg" hint-placeholder-count="3"><div title="{{sg.title}}" style="height: 10px; width: {{sg.w}}%; background: {{sg.c}}"></div></sc-for>
</div>
<span style="font-size: 12.5px; color: {{g.noteFg}}; line-height: 1.4">{{g.note}}</span>
</div>
</sc-for>
</div>
</section>
</div>
</sc-if>


<sc-if value="{{isAttention}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; gap: 4px; background: #E8E8ED; border-radius: 999px; padding: 3px">
<button onClick="{{tabTodo}}" style="border: none; border-radius: 999px; padding: 9px 16px; min-height: 38px; font-size: 14px; font-weight: 600; background: {{tabTodoBg}}; color: #1D1D1F; box-shadow: {{tabTodoSh}}">To do ({{todoCount}})</button>
<button onClick="{{tabDone}}" style="border: none; border-radius: 999px; padding: 9px 16px; min-height: 38px; font-size: 14px; font-weight: 600; background: {{tabDoneBg}}; color: #1D1D1F; box-shadow: {{tabDoneSh}}">Done this week ({{doneCount}})</button>
<button onClick="{{tabSnoozed}}" style="border: none; border-radius: 999px; padding: 9px 16px; min-height: 38px; font-size: 14px; font-weight: 600; background: {{tabSnzBg}}; color: #1D1D1F; box-shadow: {{tabSnzSh}}">Snoozed ({{snoozedCount}})</button>
</div>
<span style="font-size: 13px; color: #1E7A45; background: #E4F6EA; border-radius: 999px; padding: 8px 14px">{{feedbackNote}}</span>
</div>
<sc-if value="{{noAttention}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 44px; text-align: center; color: #6E6E73; font-size: 15px">{{emptyAttention}}</div>
</sc-if>
<sc-for list="{{attentionList}}" as="a" hint-placeholder-count="5">
<article style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 18px 20px; display: grid; grid-template-columns: 48px 1fr auto; gap: 16px; align-items: center">
<span style="width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; background: {{a.bg}}; color: {{a.fg}}">{{a.initials}}</span>
<div style="display: flex; flex-direction: column; gap: 5px; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<button onClick="{{a.open}}" style="border: none; background: none; padding: 0; font-weight: 600; font-size: 16px; color: #1D1D1F; text-decoration: underline; text-decoration-color: #D1D1D6; text-underline-offset: 3px">{{a.name}}</button>
<span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 9px; background: {{a.shapeBg}}; color: {{a.shapeFg}}">{{a.shapeLabel}}</span>
<span style="font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 9px; background: {{a.prBg}}; color: {{a.prFg}}">{{a.priority}}</span>
<span style="font-size: 12.5px; color: #86868B">{{a.session}}</span>
</div>
<span style="font-size: 14px; color: #424245; line-height: 1.45">{{a.reason}}</span>
<span style="font-size: 12.5px; color: #6E6E73"><strong style="color: #424245">Try:</strong> {{a.respond}}</span>
<sc-if value="{{a.isDone}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; font-weight: 600; color: #1E7A45">{{a.doneLabel}}</span></sc-if>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<sc-if value="{{a.isTodo}}" hint-placeholder-val="{{ true }}">
<button onClick="{{a.toggleTmpl}}" aria-expanded="{{a.isTmpl}}" style="border: none; background: #0071E3; color: #FFFFFF; border-radius: 999px; padding: 10px 16px; min-height: 42px; font-size: 13px; font-weight: 600">Message…</button>
<button onClick="{{a.called}}" style="border: 1px solid #E0E0E5; background: #FFFFFF; color: #1D1D1F; border-radius: 999px; padding: 10px 14px; min-height: 42px; font-size: 13px; font-weight: 600">Called</button>
<button onClick="{{a.notConcern}}" style="border: 1px solid #E0E0E5; background: #F9F9FB; color: #B0304A; border-radius: 999px; padding: 10px 14px; min-height: 42px; font-size: 13px; font-weight: 600">Not a concern</button>
</sc-if>
<sc-if value="{{a.isDone}}" hint-placeholder-val="{{ false }}">
<button onClick="{{a.undo}}" style="border: 1px solid #E0E0E5; background: #F9F9FB; color: #1D1D1F; border-radius: 999px; padding: 10px 14px; min-height: 42px; font-size: 13px; font-weight: 600">Undo</button>
</sc-if>
</div>
<sc-if value="{{a.isTmpl}}" hint-placeholder-val="{{ false }}">
<div style="grid-column: 1 / -1; background: #F9F9FB; border: 1px solid #ECECF0; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12.5px; font-weight: 600; color: #6E6E73">Suggested message for this pattern. Edit it in WhatsApp before sending; the app never sends anything itself.</span>
<p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #1D1D1F; background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 12px; padding: 12px 14px; user-select: all">{{a.tmpl}}</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button onClick="{{a.copyTmpl}}" style="border: none; background: #E8E8ED; color: #1D1D1F; border-radius: 999px; padding: 8px 14px; min-height: 38px; font-size: 13px; font-weight: 600">Copy</button>
<a href="{{a.waUrl}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; border-radius: 999px; padding: 8px 14px; min-height: 38px; box-sizing: border-box; font-size: 13px; font-weight: 600; background: #25A244; color: #FFFFFF; text-decoration: none">Open in WhatsApp</a>
<button onClick="{{a.messaged}}" style="border: none; background: #0071E3; color: #FFFFFF; border-radius: 999px; padding: 8px 14px; min-height: 38px; font-size: 13px; font-weight: 600">I sent it</button>
</div>
</div>
</sc-if>
<sc-if value="{{a.isPicking}}" hint-placeholder-val="{{ false }}">
<div style="grid-column: 1 / -1; background: #F5F9FF; border: 1px solid #DCEAFD; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13.5px; font-weight: 600; color: #1D1D1F">Why isn't this a concern? <span style="font-weight: 400; color: #6E6E73">A reason pauses them for 3 weeks and helps everyone see why people stop.</span></span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{a.reasons}}" as="rs" hint-placeholder-count="6"><button onClick="{{rs.pick}}" style="border: 1px solid #CFE2FB; background: #FFFFFF; color: #0058B8; border-radius: 999px; padding: 8px 14px; min-height: 38px; font-size: 13px; font-weight: 600">{{rs.label}}</button></sc-for>
<button onClick="{{a.noReason}}" style="border: 1px solid #E0E0E5; background: #FFFFFF; color: #424245; border-radius: 999px; padding: 8px 14px; min-height: 38px; font-size: 13px; font-weight: 600">No reason, just fine</button>
<button onClick="{{a.cancelPick}}" style="border: none; background: none; color: #6E6E73; padding: 8px 10px; min-height: 38px; font-size: 13px; font-weight: 600">Cancel</button>
</div>
</div>
</sc-if>
</article>
</sc-for>
</div>
</sc-if>


<sc-if value="{{isLog}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start">
<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 19px">Runs this week (W{{nextWeek}})</h2>
<span style="font-size: 12.5px; color: #86868B">Count runs from sign-up sheets or your session list. Leave at 0 if they didn't come.</span>
</div>
<button onClick="{{fillLast}}" style="border: none; background: #E8F1FD; color: #0058B8; border-radius: 999px; padding: 8px 14px; min-height: 36px; font-size: 13px; font-weight: 600">Copy last week</button>
</div>
<div style="background: #F9F9FB; border-radius: 14px; overflow: hidden">
<sc-for list="{{logRows}}" as="l" hint-placeholder-count="10">
<div style="display: grid; grid-template-columns: 36px 1fr 120px 150px; gap: 14px; align-items: center; padding: 10px 16px; border-top: {{l.divider}}">
<span style="width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: {{l.bg}}; color: {{l.fg}}">{{l.initials}}</span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14.5px; font-weight: 600">{{l.name}}</span><span style="font-size: 12px; color: #86868B">{{l.session}}</span></span>
<span style="display: flex; align-items: flex-end; gap: 3px; height: 24px" aria-label="{{l.recentLabel}}">
<sc-for list="{{l.recent}}" as="b" hint-placeholder-count="4"><span style="width: 14px; border-radius: 2px; height: {{b.h}}px; background: {{b.c}}"></span></sc-for>
</span>
<span style="display: flex; align-items: center; justify-content: flex-end; gap: 6px">
<button onClick="{{l.dec}}" aria-label="{{l.decLabel}}" style="width: 36px; height: 36px; border: none; border-radius: 999px; background: #E8E8ED; color: #1D1D1F; font-size: 18px; font-weight: 600; padding: 0">−</button>
<span style="width: 34px; text-align: center; font-size: 18px; font-weight: 700; color: {{l.valFg}}">{{l.val}}</span>
<button onClick="{{l.inc}}" aria-label="{{l.incLabel}}" style="width: 36px; height: 36px; border: none; border-radius: 999px; background: #0071E3; color: #FFFFFF; font-size: 18px; font-weight: 600; padding: 0">+</button>
</span>
</div>
</sc-for>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 18px">
<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 18px">Anything unusual this week?</h2>
<span style="font-size: 12.5px; color: #86868B; line-height: 1.4">Optional. Notes appear on every chart, so a rainy week isn't mistaken for runners losing interest.</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{weekTags}}" as="t" hint-placeholder-count="6"><button onClick="{{t.pick}}" style="border-radius: 999px; padding: 6px 12px; min-height: 34px; font-size: 12.5px; font-weight: 600; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button></sc-for>
</div>
<label for="wk-note" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Note for this week</label>
<input id="wk-note" class="fld" type="text" autocomplete="off" placeholder="Add detail, e.g. KBR Park gate closed" value="{{weekNote}}" onInput="{{onWeekNote}}">
<sc-if value="{{hasEvents}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #F0F0F3; padding-top: 8px">
<span style="font-size: 11.5px; font-weight: 600; color: #86868B">Earlier notes</span>
<sc-for list="{{eventList}}" as="e" hint-placeholder-count="2"><span style="font-size: 12.5px; color: #424245"><strong>{{e.wk}}</strong> · {{e.text}}</span></sc-for>
</div>
</sc-if>
</section>
<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px">Update patterns</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: #F5F5F7; border-radius: 12px; padding: 12px"><span style="font-size: 12px; color: #6E6E73">Runners who ran</span><div style="font-size: 24px; font-weight: 700">{{ranCount}}</div></div>
<div style="background: #F5F5F7; border-radius: 12px; padding: 12px"><span style="font-size: 12px; color: #6E6E73">Total runs</span><div style="font-size: 24px; font-weight: 700">{{runTotal}}</div></div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #6E6E73">Saving adds W{{nextWeek}} to every runner's record, drops the oldest week, and re-reads everyone's pattern.</p>
<button onClick="{{saveWeek}}" style="border: none; background: #0071E3; color: #FFFFFF; border-radius: 999px; padding: 12px 18px; min-height: 46px; font-size: 15px; font-weight: 600">Save week and update patterns</button>
</section>
<sc-if value="{{hasChanges}}" hint-placeholder-val="{{ false }}">
<section style="background: #F0F6FF; border: 1px solid #CFE2FB; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 17px">What changed in W{{week}}</h2>
<sc-if value="{{noChangeRows}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13.5px; color: #424245">Nobody changed pattern. Everyone stayed where they were.</span></sc-if>
<sc-for list="{{changeRows}}" as="c" hint-placeholder-count="3">
<button onClick="{{c.open}}" style="display: flex; flex-direction: column; gap: 4px; text-align: left; border: none; background: #FFFFFF; border-radius: 12px; padding: 10px 12px; color: #1D1D1F">
<span style="font-size: 14px; font-weight: 600">{{c.name}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600"><span style="border-radius: 999px; padding: 2px 8px; background: {{c.fromBg}}; color: {{c.fromFg}}">{{c.from}}</span><span style="color: #86868B">→</span><span style="border-radius: 999px; padding: 2px 8px; background: {{c.toBg}}; color: {{c.toFg}}">{{c.to}}</span></span>
</button>
</sc-for>
<button onClick="{{goAttention}}" style="align-self: flex-start; border: none; background: none; color: #0071E3; font-size: 13px; font-weight: 600; padding: 6px 0">See who needs you →</button>
</section>
</sc-if>
</div>
</div>
</sc-if>


<sc-if value="{{isRunners}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.pick}}" style="border-radius: 999px; padding: 8px 14px; min-height: 38px; font-size: 13px; font-weight: 600; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}} ({{c.count}})</button>
</sc-for>
<sc-if value="{{hasShapeFilter}}" hint-placeholder-val="{{ false }}">
<button onClick="{{clearShape}}" style="display: flex; align-items: center; gap: 8px; border: none; border-radius: 999px; padding: 8px 14px; min-height: 38px; font-size: 13px; font-weight: 600; background: #1D1D1F; color: #FFFFFF">Shape: {{shapeFilterLabel}}<svg width="10" height="10" viewBox="0 0 10 10" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6"></path></svg></button>
</sc-if>
</div>
<span style="display: flex; gap: 8px; flex-shrink: 0"><button onClick="{{goRosterList}}" style="border: 1px solid #E0E0E5; background: #FFFFFF; color: #1D1D1F; border-radius: 999px; padding: 10px 16px; min-height: 40px; font-size: 14px; font-weight: 600">Edit list</button><button onClick="{{goRoster}}" style="border: none; background: #0071E3; color: #FFFFFF; border-radius: 999px; padding: 10px 16px; min-height: 40px; font-size: 14px; font-weight: 600">+ Add runner</button></span>
</div>
<div style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); overflow: hidden">
<div style="display: grid; grid-template-columns: 1.9fr 1.5fr 1.4fr 1.4fr 1.6fr 0.8fr; gap: 12px; padding: 12px 20px; font-size: 12px; font-weight: 600; color: #6E6E73; background: #F9F9FB; border-bottom: 1px solid #E8E8ED">
<span>Runner</span><span>Session</span><span>State</span><span>Shape</span><span>Last 12 weeks</span><span>Last run</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<button onClick="{{r.open}}" style="width: 100%; border: none; border-bottom: 1px solid #F0F0F3; background: #FFFFFF; display: grid; grid-template-columns: 1.9fr 1.5fr 1.4fr 1.4fr 1.6fr 0.8fr; gap: 12px; padding: 12px 20px; align-items: center; text-align: left; font-size: 14px; color: #1D1D1F; min-height: 56px">
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: {{r.bg}}; color: {{r.fg}}">{{r.initials}}</span><span style="font-weight: 600">{{r.name}}</span></span>
<span style="color: #424245">{{r.group}}</span>
<span><span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; background: {{r.bg}}; color: {{r.fg}}">{{r.label}}</span></span>
<span style="font-size: 13px; font-weight: 600; color: {{r.shapeFg}}">{{r.shapeLabel}}</span>
<span style="display: flex; align-items: flex-end; gap: 3px; height: 26px">
<sc-for list="{{r.barsSm}}" as="b" hint-placeholder-count="12"><span style="width: 8px; border-radius: 2px; height: {{b.h}}px; background: {{b.c}}"></span></sc-for>
</span>
<span style="color: #424245">{{r.lastRun}}</span>
</button>
</sc-for>
</div>
<sc-if value="{{noRows}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 40px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center"><span style="font-size: 16px; font-weight: 600">{{emptyMsg}}</span><span style="font-size: 13px; color: #86868B">Try a different name, or clear the filters.</span></div>
</sc-if>
</div>
</sc-if>


<sc-if value="{{isRoster}}" hint-placeholder-val="{{ false }}">
<button onClick="{{rosterBack}}" style="border: none; background: none; color: #0071E3; font-size: 14px; font-weight: 600; padding: 0 0 12px">‹ All runners</button>
<div style="display: grid; grid-template-columns: 430px 1fr; gap: 20px; align-items: start">
<form onSubmit="{{submitForm}}" style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 24px; display: flex; flex-direction: column; gap: 16px; margin: 0">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 21px">{{formTitle}}</h2>
<span style="font-size: 13px; color: #6E6E73">{{formHint}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-name" style="font-size: 13px; font-weight: 600">Full name</label>
<input id="f-name" class="fld" type="text" autocomplete="off" placeholder="e.g. Neha Rao" value="{{form.name}}" onInput="{{onName}}">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Session</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{formGroups}}" as="g" hint-placeholder-count="4">
<button type="button" onClick="{{g.pick}}" aria-pressed="{{g.on}}" style="border-radius: 999px; padding: 8px 14px; min-height: 36px; font-size: 13px; font-weight: 600; border: 1px solid {{g.border}}; background: {{g.bg}}; color: {{g.fg}}">{{g.label}}</button>

</div>

</div>
<div style="display: flex; align-items: flex-end; gap: 4px; height: 30px">
<sc-for list="{{pv.bars}}" as="b" hint-placeholder-count="12"><span style="flex-grow: 1; border-radius: 3px; height: {{b.h}}px; background: {{b.c}}"></span></sc-for>
</div>
<span style="font-size: 12.5px; color: #424245; line-height: 1.4">{{pv.reason}}</span>
</div>
<sc-if value="{{hasErr}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="font-size: 13px; font-weight: 500; color: #B0304A; background: #FDECEF; border-radius: 10px; padding: 10px 12px">{{formErr}}</div>
</sc-if>
<div style="display: flex; gap: 10px">
<button type="submit" style="flex-grow: 1; border: none; background: #0071E3; color: #FFFFFF; border-radius: 999px; padding: 12px 18px; min-height: 44px; font-size: 15px; font-weight: 600">{{submitLabel}}</button>
<sc-if value="{{isEditing}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{cancelEdit}}" style="border: none; background: #E8E8ED; color: #1D1D1F; border-radius: 999px; padding: 12px 18px; min-height: 44px; font-size: 15px; font-weight: 600">Cancel</button>
</sc-if>
</div>
</form>

<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 19px">Your runners <span style="color: #86868B; font-weight: 600">{{runnerCount}}</span></h2>
<span style="font-size: 12.5px; color: #86868B">Saved in this browser</span>
</div>
<button onClick="{{resetSample}}" style="border: none; background: none; color: #0071E3; font-size: 13px; font-weight: 600; padding: 8px 4px; min-height: 36px">Restore sample data</button>
</div>
<div style="background: #F9F9FB; border-radius: 14px; overflow: hidden">

<span style="width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; background: {{m.bg}}; color: {{m.fg}}">{{m.initials}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14.5px; font-weight: 600">{{m.name}}</span><span style="font-size: 12.5px; color: #6E6E73">{{m.group}}, since {{m.since}}</span></span>

<button onClick="{{m.edit}}" aria-label="{{m.editLabel}}" title="Edit" style="width: 36px; height: 36px; border: none; border-radius: 999px; background: #E8E8ED; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg></button>
<button onClick="{{m.remove}}" aria-label="{{m.removeLabel}}" title="Delete" style="width: 36px; height: 36px; border: none; border-radius: 999px; background: #FDECEF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C4213A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
</span>
</div>
</sc-for>
</div>
</section>
</div>
</sc-if>


<sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; flex-direction: column; gap: 18px">
<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px; display: flex; gap: 18px; align-items: center">
<span style="width: 64px; height: 64px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; background: {{d.bg}}; color: {{d.fg}}">{{d.initials}}</span>

<div style="display: flex; gap: 8px; margin-top: 4px"><button onClick="{{editD}}" style="border: 1px solid #E0E0E5; background: #FFFFFF; color: #1D1D1F; border-radius: 999px; padding: 6px 12px; min-height: 32px; font-size: 12.5px; font-weight: 600">Edit details</button><button onClick="{{deleteD}}" style="border: 1px solid #F8D5DC; background: #FFFFFF; color: #B0304A; border-radius: 999px; padding: 6px 12px; min-height: 32px; font-size: 12.5px; font-weight: 600">Remove</button></div>
<sc-if value="{{d.hasContext}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; font-size: 12.5px; font-weight: 600; color: #0058B8; background: #E8F1FD; border-radius: 999px; padding: 4px 10px">{{d.context}}</span></sc-if>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h3 style="margin: 0; font-size: 18px">Runs per week</h3>

</div>

<span style="font-size: 12px; color: #424245">{{b.n}}</span>
<div style="width: 100%; border-radius: 8px 8px 3px 3px; height: {{b.h}}px; background: {{b.c}}"></div>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; font-size: 11px; color: #6E6E73; text-align: center">

<sc-if value="{{b.contacted}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 700; color: #0058B8; background: #E8F1FD; border-radius: 999px; padding: 1px 6px">You</span></sc-if>
<sc-if value="{{b.hasEvt}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 700; color: #A35200; background: #FFF1E2; border-radius: 999px; padding: 1px 6px">Note</span></sc-if>
</span></sc-for>
</div>
<div style="display: flex; gap: 14px; font-size: 11.5px; color: #6E6E73"><span><strong style="color: #0058B8">You</strong> = you checked in that week</span><span><strong style="color: #A35200">Note</strong> = something unusual that week (hover for details)</span></div>
</section>

<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h3 style="margin: 0; font-size: 18px">Pattern breakdown</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.55; color: #1D1D1F">{{d.signal}}</p>
<p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #424245">{{d.shapeMeans}}</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{d.sig}}" as="g" hint-placeholder-count="6">
<div style="border-radius: 12px; padding: 10px 12px; background: {{g.bg}}; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11.5px; font-weight: 600; color: {{g.fg}}">{{g.label}}</span>
<span style="font-size: 14px; font-weight: 600; color: #1D1D1F">{{g.value}}</span>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #86868B">Compared with their own usual, not the group. A pattern shows what changed, not why: injury, travel, exams or work can all look the same.</p>
</section>
</div>

<div style="display: flex; flex-direction: column; gap: 18px">
<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 20px; display: flex; flex-direction: column; gap: 10px">

</div>
<sc-for list="{{d.options}}" as="o" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid #F0F0F3; padding-top: 10px">
<span style="font-size: 14px; line-height: 1.4">{{o.text}}</span>
<button onClick="{{o.use}}" style="flex-shrink: 0; border: 1px solid #E0E0E5; background: #F9F9FB; border-radius: 999px; padding: 8px 14px; min-height: 36px; font-size: 13px; font-weight: 600; color: #1D1D1F">Use</button>
</div>
</sc-for>
</section>
<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 20px; display: flex; flex-direction: column; gap: 12px">

</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">

<button onClick="{{logCall}}" style="border: 1px solid #E0E0E5; background: #F9F9FB; border-radius: 999px; padding: 10px 6px; min-height: 42px; font-size: 13px; font-weight: 600; color: #1D1D1F">Call</button>
<button onClick="{{logMeet}}" style="border: 1px solid #E0E0E5; background: #F9F9FB; border-radius: 999px; padding: 10px 6px; min-height: 42px; font-size: 13px; font-weight: 600; color: #1D1D1F">In person</button>
</div>
<div style="display: flex; gap: 8px">
<input id="note" class="fld" type="text" autocomplete="off" placeholder="Add a note, e.g. knee injury, back in Oct" value="{{noteDraft}}" onInput="{{onNote}}" style="flex-grow: 1; min-width: 0">
<button onClick="{{addNote}}" style="border: none; background: #0071E3; color: #FFFFFF; border-radius: 999px; padding: 10px 16px; min-height: 44px; font-size: 14px; font-weight: 600">Add</button>
</div>

<span style="width: 8px; height: 8px; border-radius: 50%; background: {{l.dot}}; margin-top: 6px; flex-shrink: 0"></span>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">{{l.what}}</span><span style="font-size: 12px; color: #6E6E73">{{l.when}}</span></div>
</div>
</sc-for>
</section>
</div>
</div>
</div>
</sc-if>


<sc-if value="{{isGlobal}}" hint-placeholder-val="{{ false }}">

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<div role="group" aria-label="Whose runners" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; background: #E8E8ED; border-radius: 10px; padding: 2px; width: 220px">
<sc-for list="{{gScopes}}" as="t" hint-placeholder-count="2"><button onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="border: none; border-radius: 8px; padding: 6px 10px; min-height: 32px; font-size: 13px; font-weight: 600; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.sh}}">{{t.label}}</button></sc-for>
</div>

</div>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 12.5px; color: #6E6E73">{{gFilterNote}}</span>
<button onClick="{{downloadCsv}}" style="display: flex; align-items: center; gap: 6px; border: 1px solid #E0E0E5; background: #FFFFFF; color: #1D1D1F; border-radius: 999px; padding: 7px 14px; min-height: 34px; font-size: 13px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0071E3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Download CSV</button>
</div>
</div>
<div role="group" aria-label="Session" style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{gSessChips}}" as="c" hint-placeholder-count="7"><button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="border-radius: 999px; padding: 6px 12px; min-height: 32px; font-size: 12.5px; font-weight: 600; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button></sc-for>
</div>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #86868B">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#86868B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
Filters apply to everything on this page. Other coaches' runners are shown by number only and are read-only.
</span>

<sc-for list="{{gJump}}" as="j" hint-placeholder-count="5"><button onClick="{{j.go}}" style="border: none; background: none; color: #0071E3; border-radius: 999px; padding: 6px 10px; min-height: 30px; font-size: 12.5px; font-weight: 600">{{j.label}}</button></sc-for>
</nav>
</div>

<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">

<div style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12.5px; font-weight: 600; color: #6E6E73">{{k.label}}</span>
<span style="font-size: 28px; font-weight: 700; line-height: 1.05; color: #1D1D1F; font-variant-numeric: proportional-nums">{{k.value}}</span>
<span style="font-size: 12px; color: {{k.subFg}}; line-height: 1.35">{{k.sub}}</span>
</div>
</sc-for>
</div>

</div>
<sc-if value="{{gNoInsights}}" hint-placeholder-val="{{ false }}">
<div style="background: #F9F9FB; border-radius: 14px; padding: 16px; font-size: 13.5px; color: #6E6E73; line-height: 1.5">With {{gN}} runners the numbers are too small to call anything a pattern. Widen the filters to compare against more of the programme.</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{gInsightsShown}}" as="i" hint-placeholder-count="4">
<div style="display: flex; gap: 14px; align-items: flex-start; background: #F9F9FB; border-radius: 14px; padding: 14px 16px">
<span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: {{i.bg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{i.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg></span>

<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 999px; border: 1.5px solid #1D1D1F; box-sizing: border-box"></span>Dark outline = your runner</span>

</section>

<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 20px 22px; display: flex; flex-direction: column; gap: 12px">

<span style="font-size: 12.5px; color: #86868B; line-height: 1.5">Tip: the bottom-left of the map is where people are fading. The bottom-right is the early-warning zone: still regular, but running less.</span>

<sc-if value="{{gs.hasReason}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 600; color: #0058B8; background: #E8F1FD; border-radius: 10px; padding: 8px 10px">{{gs.reason}}</span></sc-if>

</div>
</div>
</sc-if>
</section>
</div>

<div id="g-trend" style="scroll-margin-top: 170px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; align-items: start">
<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px">

<section style="background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px">

</div>

<section id="g-compare" style="scroll-margin-top: 170px; background: #FFFFFF; border: 1px solid #ECECF0; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.04); padding: 22px 24px; display: flex; flex-direction: column; gap: 16px">
